<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Registry</title>
</head>
<body>
  <form name="consultation-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="consultation-request" />
    <input type="hidden" name="subject" value="New Tattoo Consultation Request - Iconic Tattoo Bali" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="whatsapp" />
    <input type="text" name="artist" />
    <input type="text" name="style" />
    <input type="text" name="placement" />
    <input type="text" name="size" />
    <input type="date" name="preferred_date" />
    <input type="text" name="budget" />
    <textarea name="description"></textarea>
  </form>
</body>
</html>
